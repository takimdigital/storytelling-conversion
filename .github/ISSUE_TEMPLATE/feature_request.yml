name: Suggest an improvement
description: Propose a concrete capability or documentation improvement.
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and example
      description: Include a sanitized example and how you would assess improvement.
    validations:
      required: true
