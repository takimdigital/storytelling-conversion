name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,pathlib; assert os.environ['RELEASE_TAG'] == 'v' + pathlib.Path('VERSION').read_text().strip(), 'Tag must match VERSION'"
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.skill dist/SHA256SUMS --verify-tag --title "Storytelling Conversion $RELEASE_TAG" --generate-notes
